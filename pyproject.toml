[project]
name = "comem"
version = "0.1.0"
description = "Entity matching experiments for the ComEM framework."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "diskcache>=5.6.3",
    "jupyterlab>=4.5.6",
    "openai>=2.31.0",
    "retriv>=0.2.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tenacity>=9.1.4",
    "transformers>=5.5.3",
]

[tool.uv]
override-dependencies = [
    "pystemmer>=3.0.0",
]

# https://github.com/microsoft/pyright
[tool.pyright]
include = ["src"]
venv = "llm4em"
typeCheckingMode = "off"
useLibraryCodeForTypes = true

# https://github.com/charliermarsh/ruff
[tool.ruff]
fix = true
target-version = "py311"
[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
ignore = ["E501", "E741"]
# https://github.com/timothycrosley/isort/
[tool.ruff.lint.isort]
combine-as-imports = true
